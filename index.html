<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Audio Spectrum Visualizer - AhadProCoder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050010;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .hud {
      position: absolute; top: 24px; left: 24px; z-index: 10; pointer-events: none;
    }
    .badge {
      display: inline-block; padding: 5px 14px; border-radius: 9999px;
      background: rgba(168,85,247,0.15); border: 1px solid #a855f7;
      font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
      color: #c084fc; box-shadow: 0 0 15px rgba(168,85,247,0.4);
    }
    .title { font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #a855f7; margin-top: 6px; }
    .subtitle { font-size: 13px; color: #d8b4fe; letter-spacing: 1px; }
    .drop-zone {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      text-align: center;
      padding: 40px 60px;
      border: 2px dashed #a855f7;
      border-radius: 20px;
      background: rgba(168,85,247,0.08);
      backdrop-filter: blur(10px);
      color: #c084fc;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .drop-zone:hover { background: rgba(168,85,247,0.18); border-color: #c084fc; }
    .drop-zone p { font-size: 13px; margin-top: 10px; opacity: 0.7; }
    .brand-tag {
      position: absolute; bottom: 24px; left: 24px; z-index: 10;
      font-size: 13px; letter-spacing: 2px; color: rgba(255,255,255,0.6);
    }
    .brand-tag span { color: #a855f7; font-weight: 700; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="badge">♪ WEB AUDIO API ENGINE</div>
    <div class="title">AUDIO VISUALIZER</div>
    <div class="subtitle">Drop Any Music File to Activate</div>
  </div>
  <div id="dropZone" class="drop-zone">
    🎵 Drop Audio File Here<br>
    <p>MP3 / WAV / OGG / M4A supported</p>
  </div>
  <div class="brand-tag">ENGINEERED BY <span>@AhadProCoder</span> • LEARN. CODE. BUILD.</div>
  <canvas id="viz"></canvas>
  <script>
    const canvas = document.getElementById('viz');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;
    window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });

    let analyser, dataArray, animating = false;
    let hue = 0;

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.background = 'rgba(168,85,247,0.3)'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.background = ''; });
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) startViz(file);
    });
    dropZone.addEventListener('click', () => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'audio/*';
      inp.onchange = () => { if (inp.files[0]) startViz(inp.files[0]); };
      inp.click();
    });

    function startViz(file) {
      dropZone.style.display = 'none';
      const ac = new AudioContext();
      const reader = new FileReader();
      reader.onload = e => {
        ac.decodeAudioData(e.target.result, buf => {
          const src = ac.createBufferSource();
          src.buffer = buf;
          analyser = ac.createAnalyser();
          analyser.fftSize = 256;
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          src.connect(analyser);
          analyser.connect(ac.destination);
          src.start(0);
          if (!animating) { animating = true; draw(); }
        });
      };
      reader.readAsArrayBuffer(file);
    }

    function demoMode() {
      if (!animating) { animating = true; demoAnim(); }
    }
    demoMode();

    let demoT = 0;
    function demoAnim() {
      if (analyser) return;
      demoT += 0.04;
      ctx.clearRect(0, 0, w, h);
      hue = (hue + 0.8) % 360;
      const cx = w / 2, cy = h / 2;
      const bars = 80;
      for (let i = 0; i < bars; i++) {
        const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
        const val = 0.3 + 0.7 * Math.abs(Math.sin(demoT * 2 + i * 0.2));
        const r = Math.min(w, h) * 0.18;
        const len = val * Math.min(w, h) * 0.22;
        ctx.strokeStyle = `hsl(${(hue + i * 4) % 360}, 100%, 60%)`;
        ctx.lineWidth = Math.max(2, (w / bars) * 0.5);
        ctx.shadowColor = ctx.strokeStyle;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
        ctx.lineTo(cx + Math.cos(angle) * (r + len), cy + Math.sin(angle) * (r + len));
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      requestAnimationFrame(demoAnim);
    }

    function draw() {
      if (!analyser) return;
      analyser.getByteFrequencyData(dataArray);
      ctx.clearRect(0, 0, w, h);
      hue = (hue + 0.5) % 360;
      const cx = w / 2, cy = h / 2;
      const bars = dataArray.length;
      for (let i = 0; i < bars; i++) {
        const val = dataArray[i] / 255;
        const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
        const r = Math.min(w, h) * 0.18;
        const len = val * Math.min(w, h) * 0.32;
        ctx.strokeStyle = `hsl(${(hue + i * 2) % 360}, 100%, 55%)`;
        ctx.lineWidth = Math.max(2, (w / bars) * 0.6);
        ctx.shadowColor = ctx.strokeStyle;
        ctx.shadowBlur = 15 * val;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
        ctx.lineTo(cx + Math.cos(angle) * (r + len), cy + Math.sin(angle) * (r + len));
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      requestAnimationFrame(draw);
    }
  </script>
</body>
</html>
